// =====================================================================
//  aim_training_v1 — тестовый конфиг
//  Куда положить:  ...\game\csgo\cfg\aim_training_v1_test.cfg
//  Как запустить:  в консоли CS2 -> exec aim_training_v1_test
//  Запускать в ОБЫЧНОМ CS2 (не в режиме -tools), карта:
//  map_workshop aim_training_v1 aim_training_v1
// =====================================================================

echo "=== aim_training_v1: test config ==="

// ---------------------------------------------------------------------
// 1. Базовый запуск раунда
// ---------------------------------------------------------------------
sv_cheats 1
mp_warmup_end
bot_kick
mp_restartgame 1

// ---------------------------------------------------------------------
// 2. Оружие, броня, респавн
//    (проверка логики из раздела 6 руководства)
// ---------------------------------------------------------------------
mp_free_armor 2                       // 0 = нет, 1 = кевлар, 2 = кевлар + шлем
mp_ct_default_primary weapon_ak47
mp_t_default_primary weapon_ak47
mp_ct_default_secondary weapon_deagle
mp_t_default_secondary weapon_deagle
mp_ct_default_melee weapon_knife
mp_t_default_melee weapon_knife
mp_respawn_on_death_ct 1              // deathmatch-респавн: ключ к тренировочному режиму
mp_respawn_on_death_t 1
mp_buy_anywhere 1
mp_freezetime 0
mp_roundtime 60
mp_timelimit 0
mp_startmoney 60000
mp_maxmoney 60000
mp_limitteams 0
mp_autoteambalance 0

// ---------------------------------------------------------------------
// 3. Стрельба и спрей
// ---------------------------------------------------------------------
sv_infinite_ammo 2                    // 1 = бесконечный БК, 2 = бесконечный магазин
weapon_accuracy_nospread 1            // убрать разброс -> чистый паттерн отдачи
sv_showimpacts 1                      // точки попаданий
cl_weapon_debug_show_accuracy 2       // круг разброса

// ---------------------------------------------------------------------
// 4. Nav mesh (раскомментировать после того, как геометрия зафиксирована)
//    Если "no walkable seeds present" — в карте нужна сущность point_nav_walkable
// ---------------------------------------------------------------------
// nav_edit 1
// nav_generate
// nav_save
// mp_restartgame 1

// ---------------------------------------------------------------------
// 5. Боты вместо статичных мишеней (опция)
// ---------------------------------------------------------------------
// bot_add_ct
// custom_bot_difficulty 2             // 0..3 — реальный рычаг сложности (bot_difficulty не работает)
// bot_stop 1                          // боты стоят на месте
// bot_kick                            // убрать всех

// ---------------------------------------------------------------------
// 6. Диагностика
// ---------------------------------------------------------------------
developer 1                           // в логе видны цепочки entity outputs
cl_showfps 2

echo "=== aim_training_v1: ready ==="
